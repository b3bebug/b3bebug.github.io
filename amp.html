<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amp Tone & Live Simulator - ToneLab Studio</title>
<style>
:root{--bg:#f6f2e9;--card:#fffdf9;--accent:#b45309;--text:#1f2937;--muted:#6b7280;--border:#e2dac8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--card);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.back-btn{text-decoration:none;color:var(--accent);font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:.4rem}
.lang-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:.4rem .8rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85rem}
.container{max-width:820px;margin:2rem auto;padding:0 1rem}
.amp-stage{background:#262320;color:#f5f2eb;border:3px solid #443d36;border-radius:16px;padding:1.8rem;box-shadow:0 10px 25px rgba(0,0,0,.15);margin-bottom:1.5rem}
.amp-top{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.amp-top h1{font-size:1.6rem;color:#fff}
.amp-badge{background:#141210;color:#fbbf24;border:1px solid #574e44;padding:.35rem .9rem;border-radius:6px;font-weight:800;letter-spacing:1px}
.knobs-big{display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:space-around;background:#1a1816;padding:1.5rem;border-radius:12px;border:1px solid #3a342e;margin-bottom:1.5rem}
.knob-unit{text-align:center;width:76px}
.knob{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#4a443e 30%,#141210 100%);border:3px solid #8c8275;margin:0 auto .4rem;position:relative}
.knob-line{width:4px;height:22px;background:#fbbf24;position:absolute;top:5px;left:50%;margin-left:-2px;transform-origin:bottom center;border-radius:2px}
.knob-label{font-size:.8rem;color:#b8b0a4;display:block}.knob-val{font-size:.95rem;font-weight:bold;color:#fbbf24}
button.live-btn{width:100%;padding:.9rem;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.2s}
button.live-btn.on{background:#16a34a}
.guide-card{background:var(--card);padding:1.8rem;border-radius:12px;border:1px solid var(--border)}
.guide-card h2{color:var(--accent);margin-bottom:.8rem;font-size:1.25rem}
footer{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <a href="index.html" class="back-btn" data-en="← Back to ToneLab Studio" data-es="← Volver a ToneLab Studio">← Back to ToneLab Studio</a>
  <button class="lang-btn" onclick="toggleLang()" id="lBtn">ES / Español</button>
</header>
<div class="container">
  <div class="amp-stage">
    <div class="amp-top"><h1 id="artistTitle">Loading...</h1><span class="amp-badge" id="ampModel">AMP</span></div>
    <div class="knobs-big" id="knobsBox"></div>
    <button class="live-btn" id="liveBtn" onclick="togglePageLive()" data-en="Plug In & Play Guitar Live" data-es="Conectar y Tocar Guitarra en Vivo">Plug In & Play Guitar Live</button>
  </div>
  <div class="guide-card">
    <h2 data-en="Tone Breakdown & Gear Tips" data-es="Análisis del Sonido y Consejos de Equipo">Tone Breakdown & Gear Tips</h2>
    <p id="toneDesc" style="font-size:1rem;line-height:1.7"></p>
  </div>
</div>
<footer><p>© 2026 ToneLab Studio — tonelabjam@gmail.com | <a href="privacy.html" style="color:var(--accent)">Privacy Policy & Cookies</a></p></footer>
<script src="amps.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const ampIndex = parseInt(params.get('id')) || 0;
const currentAmp = ampPresets.at(ampIndex) || ampPresets.at(0);

function renderSingleAmp(){
  document.title = currentAmp.artist + " - ToneLab Studio";
  document.getElementById('artistTitle').innerText = currentAmp.artist;
  document.getElementById('ampModel').innerText = currentAmp.amp;
  document.getElementById('toneDesc').innerText = lang === 'en' ? currentAmp.en : currentAmp.es;
  const box = document.getElementById('knobsBox');
  box.innerHTML = '';
  currentAmp.knobs.forEach(k => {
    const deg = -135 + (k.v * 27);
    box.innerHTML += `<div class="knob-unit"><div class="knob"><div class="knob-line" style="transform:rotate(${deg}deg)"></div></div><span class="knob-label">${k.n}</span><span class="knob-val">${k.v}</span></div>`;
  });
  const btn = document.getElementById('liveBtn');
  const isOn = (liveAmpIdx === ampIndex);
  btn.classList.toggle('on', isOn);
  btn.innerText = isOn ? (lang === 'en' ? 'Stop Guitar Audio' : 'Detener Guitarra') : (lang === 'en' ? 'Plug In & Play Guitar Live' : 'Conectar y Tocar Guitarra en Vivo');
}

async function togglePageLive(){
  await toggleLiveAmp(ampIndex);
  renderSingleAmp();
}

function toggleLang(){
  lang = lang === 'en' ? 'es' : 'en';
  document.getElementById('lBtn').innerText = lang === 'en' ? 'ES / Español' : 'EN / English';
  document.querySelectorAll('[data-en]').forEach(e => e.innerText = e.getAttribute('data-' + lang));
  renderSingleAmp();
}

renderSingleAmp();
<script>
const params = new URLSearchParams(window.location.search);
const ampIndex = parseInt(params.get('id')) || 0;
const currentAmp = JSON.parse(JSON.stringify(ampPresets.at(ampIndex) || ampPresets.at(0)));
let liveChain = null;

function renderSingleAmp(){
  document.title = currentAmp.artist + " - ToneLab Studio";
  document.getElementById('artistTitle').innerText = currentAmp.artist;
  document.getElementById('ampModel').innerText = currentAmp.amp;
  document.getElementById('toneDesc').innerText = lang === 'en' ? currentAmp.en : currentAmp.es;
  const box = document.getElementById('knobsBox'); box.innerHTML = '';
  currentAmp.knobs.forEach((k, kIdx) => {
    const deg = -135 + (k.v * 27);
    box.innerHTML += `<div class="knob-unit"><div class="knob"><div class="knob-line" id="kl-${kIdx}" style="transform:rotate(${deg}deg)"></div></div><span class="knob-label">${k.n}</span><span class="knob-val" id="kv-${kIdx}">${k.v}</span><input type="range" min="0" max="10" step="1" value="${k.v}" style="width:100%;accent-color:#fbbf24;margin-top:4px" oninput="updateKnob(${kIdx}, this.value)"></div>`;
  });
}

function updateKnob(kIdx, val){
  val = parseFloat(val);
  currentAmp.knobs.at(kIdx).v = val;
  document.getElementById('kv-' + kIdx).innerText = val;
  document.getElementById('kl-' + kIdx).style.transform = `rotate(${-135 + (val * 27)}deg)`;
  if(!liveChain) return;
  if(kIdx === 0){ liveChain.pre.gain.value = 1 + (val * 0.8); liveChain.shaper.curve = makeDistortionCurve(val); }
  else if(kIdx === 1) liveChain.bass.gain.value = (val - 5) * 2.5;
  else if(kIdx === 2) liveChain.mid.gain.value = (val - 5) * 2.8;
  else if(kIdx === 3) liveChain.treb.gain.value = (val - 5) * 2.5;
}

async function togglePageLive(){
  unlockAudio();
  const btn = document.getElementById('liveBtn');
  if(liveStream){ liveStream.getTracks().forEach(t => t.stop()); liveStream = null; liveChain = null; btn.classList.remove('on'); btn.innerText = lang === 'en' ? 'Plug In & Play Guitar Live' : 'Conectar y Tocar Guitarra en Vivo'; return; }
  try{
    liveStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src = ctx.createMediaStreamSource(liveStream), k = currentAmp.knobs;
    const pre = ctx.createGain(); pre.gain.value = 1 + (k.at(0).v * 0.8);
    const shaper = ctx.createWaveShaper(); shaper.curve = makeDistortionCurve(k.at(0).v); shaper.oversample = '4x';
    const bass = ctx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 140; bass.gain.value = (k.at(1).v - 5) * 2.5;
    const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 750; mid.Q.value = 1.2; mid.gain.value = (k.at(2).v - 5) * 2.8;
    const treb = ctx.createBiquadFilter(); treb.type = 'highshelf'; treb.frequency.value = 2800; treb.gain.value = (k.at(3).v - 5) * 2.5;
    const cab = ctx.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 4200;
    const master = ctx.createGain(); master.gain.value = 0.35;
    src.connect(pre); pre.connect(shaper); shaper.connect(bass); bass.connect(mid); mid.connect(treb); treb.connect(cab); cab.connect(master); master.connect(ctx.destination);
    liveChain = { pre, shaper, bass, mid, treb };
    btn.classList.add('on'); btn.innerText = lang === 'en' ? 'Stop Guitar Audio' : 'Detener Guitarra';
  }catch(e){ alert(lang === 'en' ? 'Allow microphone/interface access.' : 'Permite el acceso al micrófono/interfaz.'); }
}

function toggleLang(){ lang = lang === 'en' ? 'es' : 'en'; document.getElementById('lBtn').innerText = lang === 'en' ? 'ES / Español' : 'EN / English'; document.querySelectorAll('[data-en]').forEach(e => e.innerText = e.getAttribute('data-' + lang)); renderSingleAmp(); }
renderSingleAmp();
</script>
